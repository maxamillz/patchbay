plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maxamillz.patchbay'
    compileSdk 36

    defaultConfig {
        applicationId 'com.maxamillz.patchbay'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
